name: ifret
description: "i-fret, un service ILT"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  lucide_icons_flutter: ^4.0.3
  flutter_svg: ^2.4.0
  geolocator: ^14.1.2
  geocoding: ^5.0.1
  url_launcher: ^6.3.3
  image_picker: ^1.2.4
  pdf: ^3.13.1
  printing: ^5.15.1
  flutter_map: ^8.3.2
  latlong2: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
    - assets/images/
  fonts:
    - family: WorkSans
      fonts:
        - asset: assets/fonts/WorkSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/WorkSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/WorkSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/WorkSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/WorkSans-BlackItalic.ttf
          weight: 900
          style: italic

# Icône de l'application : `dart run flutter_launcher_icons` la décline pour chaque plateforme.
flutter_launcher_icons:
  image_path: assets/icon/icon.png
  android: true
  adaptive_icon_background: "#FFCC00"
  adaptive_icon_foreground: assets/icon/icon_fg.png
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
    image_path: assets/icon/icon.png
    background_color: "#1E1E1E"
    theme_color: "#FFCC00"
